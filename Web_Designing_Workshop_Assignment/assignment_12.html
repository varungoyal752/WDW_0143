<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Marks</title>
    <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #777; padding: 8px; }
  </style>
</head>
<body>
  <table border="1">
    <caption>Student Marks</caption>
    <thead>
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
    </thead>
    <tbody>
    <tr>
        <td>1</td>
        <td>Aman</td>
        <td>85</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Riya</td>
        <td>92</td>
    </tr>
    </tbody>
    <tfoot>
       <tr>
         <td colspan="2">Average</td>
         <td>88.5</td>
       </tr>
    </tfoot>
  </table>
</body>
</html>
