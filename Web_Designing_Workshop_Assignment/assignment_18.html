<!DOCTYPE html>
<html lang="en">
<head>
  <title>ABC College Admission 2026</title>
  <style>
    body { font-family:serif; margin: 20px; line-height: 1.5; }
    header, footer { background: #202b83; color: white; text-align: center; padding: 12px;}
    main { max-width: 600px; margin: auto; }
    table { border-collapse: collapse; width: 100%; }
    th { border: 1px solid #999; padding: 8px; text-align: center;background-color: lavender; }
     td { border: 1px solid #999; padding: 8px; text-align: left; }
    fieldset { margin-top: 16px; }
    label { display: block; margin-top: 10px; }
    input, select, textarea { max-width: 100%; }
  </style>
</head>
<body>
  <header><h1>ABC College Admission 2026</h1></header>
  <main id="main">
    <section aria-labelledby="fees-title">
      <h2 id="fees-title">Courses and Fees</h2>
      <table>
        <caption>Available Courses</caption>
        <thead>
            <tr><th>Course</th><th>Seats</th><th>Fees</th></tr>
        </thead>
        <tbody>
          <tr><td>B.Tech CSE</td><td>120</td><td>₹90,000</td></tr>
          <tr><td>BCA</td><td>60</td><td>₹45,000</td></tr>
        </tbody>
      </table>
    </section>
    <section aria-labelledby="form-title">
      <form action="submit.php" method="post">
        <fieldset>
          <legend>Application Form</legend>
          <label for="name">Name:</label>
          <input id="name" name="name" type="text" required>
          <label for="email">Email:</label>
          <input id="email" name="email" type="email" required>
          <label for="course">Course:</label>
          <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="btech-cse">B.Tech CSE</option>
            <option value="bca">BCA</option>
          </select>
          <label for="statement">Statement:</label>
          <textarea id="statement" name="statement" rows="4" cols="60"
            required></textarea>
            <br>
          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>
  </main>
  <br>
  <footer><small>&copy; 2026 ABC College</small></footer>
</body>
</html>
