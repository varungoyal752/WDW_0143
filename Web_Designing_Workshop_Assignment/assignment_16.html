<!DOCTYPE html>
<html lang="en">
<head>
  <title>Course Feedback</title>
</head>
<body>
  <form>
    <p><label for="course">Course:</label>
      <select id="course" name="course">
        <option value="ece">ECE</option>
        <option value="cse">CSE</option>
        <option value="it">IT</option>
      </select>
    </p>
    <p><label for="feedback">Feedback:</label><br>
      <textarea id="feedback" name="feedback" rows="5"
        cols="35" placeholder="Write here..."></textarea>
    </p>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" onclick="alert('Hi')">Click Me</button>
  </form>
</body>
</html>
