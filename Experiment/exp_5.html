<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial scale=1.0">
        <title>Student Registration Form</title>
    </head>
        <body>
            <h1 align="center">Student Registration Form</h1>
            <hr>
            <form method="post" action="sample.com">
                <label for="name">Full Name:</label>
                <input id="name" type="text" placeholder="Enter your full name" required><br><br>

                <label for="email">Email:</label>
                <input id="email" type="email" placeholder="Enter valid email address"><br><br>

                <label for="password">Password:</label>
                <input id="password" type="password" placeholder="Enter password"><br><br>

                <label for="gender">Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
                <br><br>

                <label for="course">Course:</label>
                <select id="course">
                    <option value="" disabled selected hidden>--Select Course--</option>
                    <option>BTECH</option>
                    <option>BBA</option>
                    <option>MBA</option>
                </select><br><br>

                <label for="contact">Contact No:</label>
                <input type="number" id="contact" placeholder="Enter phone number"><br><br>

                <label for="address">Address:</label><br>
                <textarea name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea><br><br>
                
                <button type="submit">Register</button>
                <button type="reset">Clear</button>
                <hr>
            </form>
            
            <p align="center">
                &copy;2025 Student Registration Portal
            </p>
        </body>
</html>
